<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#232428">
  <title>Piano</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="src/keel/errlog.js?v=1.0.0" data-key="piano.log" data-keep="50" data-console></script>

<body>
  <nav id="menubar" class="menubar" role="menubar" aria-label="Menu">
    <span class="spacer"></span>
    <h1 id="title" class="title">Piano</h1>
    <button id="settings-btn" class="icon-btn quiet" type="button"></button>
  </nav>

  <main id="library" class="library"></main>

  <main id="lesson-screen" class="lesson-screen" hidden>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Play controls"></div>
    <div id="timeline" class="timeline"></div>
    <div id="routine" class="routine" hidden></div>
    <div id="panels" class="panels"></div>
  </main>

  <footer class="statusbar">
    <button id="device" class="chip" type="button"></button>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <button id="update" class="chip update" type="button" hidden></button>
    <span id="today"></span>
  </footer>

  <dialog id="settings" class="sheet" aria-labelledby="settings-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="src/keel/platform.js?v=1.0.0"></script>

  <script src="src/vendor/osmd.min.js?v=1.0.0"></script>
