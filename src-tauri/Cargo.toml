[package]
name = "piano"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2"
# The portable updater (src/portable.rs): the release check and download
# (Windows' own TLS), and the signature check the Tauri updater uses.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking"] }
minisign-verify = "0.3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
# The PDMX collection (src/pdmx.rs): its index and its score archive, read
# as they download.
csv = "1"
flate2 = "1"
tar = "0.4"
# generate_context!() writes code that uses it.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
